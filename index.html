
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindu Hasini Electricals</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f9;color:#172033}
header{background:#10243b;color:white;padding:22px 18px}
header h2{margin:0;font-size:21px}
header p{margin:7px 0 0;color:#cbd5e1;font-size:13px}
main{padding:18px;max-width:850px;margin:auto}
h3{margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0000000c}
.card span{font-size:13px;color:#64748b}
.card strong{display:block;font-size:28px;margin-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;background:#173b60;color:white;padding:14px;border-radius:9px;font-size:14px}
footer{text-align:center;color:#64748b;font-size:12px;padding:25px}
</style>
</head>
<body>
<header>
<h2>BINDU HASINI ELECTRICALS</h2>
<p>Rice Mill Machinery • Electricals • Automation</p>
</header>
<main>
<h3>Business Overview</h3>
<div class="grid">
<div class="card"><span>Total Customers</span><strong>0</strong></div>
<div class="card"><span>Total Enquiries</span><strong>0</strong></div>
<div class="card"><span>Service Jobs</span><strong>0</strong></div>
<div class="card"><span>Inventory Items</span><strong>0</strong></div>
<div class="card"><span>Document Value</span><strong>₹0</strong></div>
<div class="card"><span>Business Status</span><strong style="font-size:18px">Ready</strong></div>
</div>
<h3>Quick Actions</h3>
<div class="actions">
<button>+ New Enquiry</button>
<button>+ New Customer</button>
<button>Service Jobs</button>
<button>Stock Management</button>
<button>Quotations</button>
<button>GST Invoices</button>
</div>
</main>
<footer>
BINDU HASINI ELECTRICALS • Vijayawada, Andhra Pradesh<br>
Business Management Portal
</footer>
</body>
</html>
